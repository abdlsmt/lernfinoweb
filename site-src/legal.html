<!doctype html>
<html lang="{{locale}}" dir="{{direction}}" data-theme="light" data-page-lang="{{code}}" data-base="{{base}}" data-legal-page="{{kind}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#181e29">
  <title>{{heading}} · Lernfino</title>
  <meta name="description" content="{{heading}} · Lernfino">
  {{alternates}}
  <link rel="icon" href="{{base}}/assets/fino-icon.webp" type="image/webp">
  <link rel="stylesheet" href="{{base}}/styles.css?v=web1">
  <link rel="stylesheet" href="{{base}}/home.css?v=web1">
  <script src="{{base}}/app.js?v=web1" defer></script>
</head>
<body class="web-legal">
  <div class="flag-topline" aria-hidden="true"><span class="flag-black"></span><span class="flag-red"></span><span class="flag-gold"></span></div>
  <header class="web-header"><div class="container web-header-inner">{{brand}}<div class="web-header-actions">{{languageMenu}}{{themeButton}}</div></div></header>
  <main class="container web-legal-main">
    <header><h1>{{heading}}</h1>{{dateLabel}}{{officialNotice}}</header>
    <article class="legal-prose">{{article}}</article>
  </main>
  {{footer}}
</body>
</html>
